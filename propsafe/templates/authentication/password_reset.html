{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'css/authentication/forget.css' %}">
</head>
<body>
    <div class="forget_popup">
        <div class="popup_body">
            <form action="" method="post">
                {% csrf_token %}
                <h4>Reset Password</h4>
                <p>Forgotten your password? Enter your email address below, and we'll send you an email allowing you to reset it.</p>
                <p>Provide the email address associated with your account to recover your password.</p>
                <div class="input">
                    <label for="email">Email</label>
                    <input type="text" name="email" placeholder="name@email.com" autocomplete="off" required>
                </div>
                <input type="submit" value="Send Reset Link">
                <p>Back to login? <a href="{% url 'account:login' %}">Log In</a></p>
            </form>
        </div>
    </div>
</body>
</html>
